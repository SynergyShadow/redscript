name: Build redscript

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      ARCHIVE_NAME: redscript-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ inputs.suffix }}.zip
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ inputs.os }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Package on Windows
        if: ${{ inputs.os == 'windows-latest' }}
        shell: pwsh
        run: |
          .\resources\package.ps1 -stagingDir "$env:RUNNER_TEMP\redscript-staging" -archiveName "$env:ARCHIVE_NAME"

      - name: Package on Linux and macOS
        if: ${{ inputs.os != 'windows-latest' }}
        shell: bash
        run: |
          ./resources/package.sh "$RUNNER_TEMP/redscript-staging" "$ARCHIVE_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ inputs.os }}
          path: |
            ${{ runner.temp }}/redscript-staging/**
            ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  build-matrix:
    if: ${{ github.event_name != 'workflow_call' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
          - os: ubuntu-latest
            suffix: linux
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}
