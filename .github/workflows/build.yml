name: Build redscript

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45

    env:
      ARCHIVE_NAME: redscript-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ inputs.suffix }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ inputs.os }}
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Package on Windows
        if: ${{ inputs.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:RUNNER_TEMP 'redscript-staging'
          .\resources\package.ps1 -stagingDir $stagingDir -archiveName "$env:ARCHIVE_NAME"

      - name: Package on Linux and macOS
        if: ${{ inputs.os != 'windows-latest' }}
        shell: bash
        run: |
          ./resources/package.sh "$RUNNER_TEMP/redscript-staging" "$ARCHIVE_NAME"

      - name: Verify packaged outputs
        shell: pwsh
        env:
          ARTIFACT_SUFFIX: ${{ inputs.suffix }}
        run: |
          $cli = switch ($env:ARTIFACT_SUFFIX) {
            'windows' { 'redscript-cli.exe' }
            'macos'   { 'redscript-cli-aarch64-darwin' }
            'linux'   { 'redscript-cli-x86_64-linux-gnu' }
            default   { throw "Unsupported artifact suffix: $env:ARTIFACT_SUFFIX" }
          }

          foreach ($path in @($cli, $env:ARCHIVE_NAME)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing packaged output: $path"
            }

            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Packaged output is empty: $path"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ inputs.os }}
          path: |
            redscript-cli*
            ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
