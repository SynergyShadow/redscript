name: Build redscript CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
          - os: ubuntu-latest
            suffix: linux

    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      suffix: ${{ matrix.suffix }}
